server {

    server_name vakimotors.vinparts.kz;
    root /var/www/kolesa-crm/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /storage/ {
        if (-f $request_filename) {
            break;
        }

        rewrite ^/storage/(.*) /storage/$1 permanent;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param   REQUEST_SCHEME  'https';
        fastcgi_param   HTTPS           'on';
    }

    location ~ /\.ht {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vakimotors.vinparts.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vakimotors.vinparts.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = vakimotors.vinparts.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;

    server_name vakimotors.vinparts.kz;
    return 404; # managed by Certbot


}